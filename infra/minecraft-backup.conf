# SofiaVarna backup settings. Read by /usr/local/sbin/minecraft-backup.
# Schedules live on the systemd timers. Retention and paths live here.

CTID=111
MINECRAFT_ROOT=/opt/minecraft

LOCAL_DIR=/var/backups/minecraft
LOCAL_KEEP=4
# 15 GiB, so one uncompressed tar plus one compressed archive still fits.
LOCAL_MIN_FREE_KIB=15728640

# Off-host copy: rclone crypt remote over a Cloudflare R2 bucket (EU jurisdiction).
# The R2 remote and its bucket-scoped key live only in /root/.config/rclone/rclone.conf.
# Same crypt password as the old Drive copies.
R2_ENABLED=1
R2_REMOTE=sofiavarna-r2:
R2_KEEP=7
# Upload the newest local archive once a day; 05:00 and 17:00 archives would otherwise both go up.
R2_MIN_AGE_HOURS=20
CRYPT_PASS_FILE=/root/minecraft-gdrive-crypt-pass

HISTORY_LOG=/var/backups/minecraft/history.log
LOCK_FILE=/run/lock/minecraft-backup.lock
