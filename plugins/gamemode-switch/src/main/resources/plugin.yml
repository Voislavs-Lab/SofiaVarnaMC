name: GameModeSwitch
version: 1.1.0
main: com.sofiavarna.gamemodeswitch.GameModeSwitchPlugin
api-version: '26.3'
description: Survival and spectator without op, through /spec, /surv, /gamemode, and F3+N / F3+F4
author: SofiaVarna
commands:
  spectator:
    description: Switch yourself to spectator mode
    usage: /spec
    aliases: [spec]
    permission: gamemodeswitch.use
  survival:
    description: Switch yourself to survival mode
    usage: /surv
    aliases: [surv]
    permission: gamemodeswitch.use
permissions:
  gamemodeswitch.use:
    description: /spec and /surv on yourself, and F3+N / F3+F4 (also needs minecraft.command.gamemode)
    default: false
  gamemodeswitch.unrestricted:
    description: Skip the survival/spectator and self-only limits on /gamemode and F3+F4
    default: op
